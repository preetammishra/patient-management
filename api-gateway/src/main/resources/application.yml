
server:
  port: 4004

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Patient Service Route - ENABLED
            - id: patient-service-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/patients,/api/patients/**
              filters:
                - StripPrefix=1

                # JWT Validation - DISABLED
                # - JwtValidation

            # Patient Swagger Docs - ENABLED
            - id: api-docs-patient-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api-docs/patients
              filters:
                - RewritePath=/api-docs/patients,/v3/api-docs

            # Auth Service Route - DISABLED
            # - id: auth-service-route
            #   uri: http://auth-service:4005
